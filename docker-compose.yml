services:
  mysql:
    image: mysql:8.0
    container_name: residuos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: residuos_iot_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - residuos_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: residuos_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - residuos_net

volumes:
  mysql_data:

networks:
  residuos_net:
    driver: bridge